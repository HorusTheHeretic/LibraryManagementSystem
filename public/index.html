<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Library Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f5f7fb}.navbar-brand{font-weight:700;letter-spacing:.02em}.card{border:0;box-shadow:0 4px 16px #152b4b0b}.table{--bs-table-bg:#fff}.content{max-width:1200px}.muted{color:#6c757d}.auth-card{max-width:460px;margin:7vh auto}.stat-value{font-size:1.65rem;font-weight:700}.table td{vertical-align:middle}.actions{white-space:nowrap}

<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    </div>

    <div id="message"></div>
    <div id="app"></div>
